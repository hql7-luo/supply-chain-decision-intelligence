[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-decision-intelligence"
version = "1.0.0"
description = "Real retail stockout data, SQL analytics, time-validated forecasts, and transparent planning decisions"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "pyarrow>=19,<24",
  "plotly>=6,<7", "streamlit>=1.65,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
viz = [
    "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
